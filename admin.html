<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>KS Portfolio | Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><a class="brand" href="./">KS <span>Portfolio</span></a><a href="./">View site ↗</a></header><main><p class="eyebrow">KS PORTFOLIO / ADMINISTRATION</p><h1>Content dashboard<span>.</span></h1><p class="sub">Create, edit and publish your projects from one place.</p><section id="login" class="panel"><h2>Admin login</h2><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password"></label><button id="signIn">Sign in</button></section><section id="dashboard" hidden><div class="bar"><h2>Projects <small id="count"></small></h2><div><button id="reload" class="secondary">Refresh</button> <button id="new" class="secondary">New project</button> <button id="logout" class="secondary">Log out</button></div></div><div class="columns"><section class="panel"><h3>Your projects</h3><div id="projectList">Loading…</div></section><form class="panel" id="projectForm"><h3 id="formTitle">Add project</h3><input type="hidden" id="projectId"><label>Title<input id="title" required></label><label>Category<input id="category" placeholder="Photography"></label><label>Description<textarea id="description" rows="4"></textarea></label><label>Cover image URL<input id="cover" type="url"></label><label>Upload photo to Google Drive<input id="photo" type="file" accept="image/*"></label><button type="button" id="uploadPhoto" class="secondary">Upload photo</button><label>Project link<input id="url" type="url"></label><label>Technology<input id="technology"></label><label>Status<select id="status"><option value="Published">Published</option><option value="Draft">Draft</option></select></label><label class="checkbox"><input type="checkbox" id="featured"> Featured project</label><div class="bar"><button type="submit">Save project</button><button type="button" class="danger" id="remove" hidden>Delete</button></div></form></div></section><p id="message" role="status"></p></main><iframe name="responseFrame" title="Server response" hidden></iframe><script src="admin.js" defer></script></body></html>
